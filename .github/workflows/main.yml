name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: npm install && npm test && npm run build:android-assets
        working-directory: shieldguard
      - run: gradle -p shieldguard/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shieldguard-debug-apk
          path: shieldguard/android/app/build/outputs/apk/debug/app-debug.apk
